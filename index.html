<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monique Araújo Advocacia</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Cinzel:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0b; --bg2:#1a0508; --wine:#6b0610; --wine2:#8f0a16;
  --gold:#d9b25f; --gold2:#f2d68f; --text:#f4ead3; --muted:#c9b98f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;min-height:100%;color:var(--text);
  font-family:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  background:radial-gradient(ellipse at top,var(--wine) 0%,var(--bg2) 45%,var(--bg) 100%) fixed;
  display:flex;justify-content:center;
}
.card{width:100%;max-width:440px;padding:36px 22px 40px;text-align:center}
.logo{display:block;width:230px;max-width:70%;height:auto;margin:6px auto 14px}
.rule{display:flex;align-items:center;gap:10px;justify-content:center;margin:0 auto}
.rule::before,.rule::after{content:"";height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold))}
.rule::after{background:linear-gradient(270deg,transparent,var(--gold))}
.rule i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg)}
h1{
  font-family:"Cinzel",Georgia,serif;font-weight:500;font-size:24px;letter-spacing:3px;
  color:var(--gold2);margin:16px 0 6px;text-transform:uppercase;
}
.sub{font-family:"Cinzel",Georgia,serif;font-size:13px;letter-spacing:7px;color:var(--gold);text-transform:uppercase;margin:0}
.oab{margin:14px 0 0;font-size:18px;color:var(--muted);letter-spacing:1px}
.areas{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:26px 0 8px}
.areas span{
  border:1px solid rgba(217,178,95,.55);color:var(--gold2);border-radius:999px;
  padding:6px 14px;font-size:15px;font-weight:700;letter-spacing:1.5px;
  background:rgba(0,0,0,.28);
}
.links{display:grid;gap:12px;margin-top:26px}
.btn{
  display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--text);
  padding:14px 18px;border-radius:12px;text-align:left;
  background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.25));
  border:1px solid rgba(217,178,95,.6);
  transition:transform .15s,border-color .15s,background .15s;
}
.btn:hover,.btn:focus-visible{transform:translateY(-2px);border-color:var(--gold2);background:rgba(107,6,16,.55);outline:none}
.ico{
  flex:none;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--gold);
  display:grid;place-items:center;color:var(--gold2);
}
.ico svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.btn small{display:block;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)}
.btn b{display:block;font-size:19px;font-weight:600;overflow-wrap:anywhere}
.wa{background:linear-gradient(135deg,var(--wine2),var(--wine));border-color:var(--gold2)}
.share{
  margin-top:22px;width:100%;cursor:pointer;font:inherit;font-size:19px;font-weight:700;letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  color:#1a0508;background:linear-gradient(135deg,var(--gold2),var(--gold) 60%,#b88a35);
  border:0;border-radius:12px;padding:15px;
}
.share:hover,.share:focus-visible{filter:brightness(1.08);outline:none}
.share svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
  background:#000;color:var(--gold2);border:1px solid var(--gold);border-radius:999px;
  padding:10px 20px;font-size:17px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{margin-top:30px;font-size:14px;color:var(--muted);letter-spacing:1px}
</style>
</head>
